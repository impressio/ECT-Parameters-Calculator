<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-labelledby="title desc">
<title id="title">Styrka-durationskurvor på tre avstånd från elektroden</title>
<desc id="desc">Schematiska kurvor för tröskelström mot pulsbredd. Kurvan för en nervcell längre från elektroden ligger högre. En vågrät linje visar en given strömstyrka: nära nervceller nås redan vid korta pulser, längre bort krävs längre puls, och långt bort krävs minst 0,6 ms.</desc>
