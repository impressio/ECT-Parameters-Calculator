# Bokens hierarki: delar (mappar i valvet) och kapitel (filer) i ordning. Skapas med
# python3 publish/build.py --manifest och kan redigeras (ordning, deltitlar, utelämnade kapitel). Ett kapitel kan
# ha underkapitel (fil: och underkapitel:); de numreras under kapitlet (5.1.1, 5.1.2 ...). Varje del utom den sista
# avslutas med kapitlet Referenser, som visas onumrerat.
titel: ECT-kompendium
undertitel: Kompendium för ECT-behandlare
webbplats: https://ect.matty.se
# Kompendiets innehållskapitel tas inte med: bokens innehållsförteckning (med sidnummer) ersätter det, och länkar
# dit leder till innehållsförteckningen
ersatta_kapitel:
  02 Innehåll: innehall
# Avsnitt som börjar på ny sida i boken (kapitel och rubrik), t.ex. för att två avsnitt ska hamna på samma sida
sidbrytning_fore:
- kapitel: 02 Indikationer och bedömning/04 Läkemedel och interaktioner.md
  rubrik: Behandlingsplan
- kapitel: 09 Uppföljning och underhållsbehandling/01 Behandlingsförlopp och serielängd.md
  rubrik: Antal behandlingar
# Figurer som ställs sida vid sida i boken (den andra flyttas upp bredvid den första)
figurpar:
- kapitel: 04 Elektrodplacering/01 Elektrodplacering.md
  figurer:
  - Elektrodplaceringar RUL BT.svg
  - Elektrodplacering anatomiska landmarken.svg
